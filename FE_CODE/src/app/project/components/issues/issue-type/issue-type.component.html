<div class="type-dropdown">
  <ng-container *ngIf="!readOnly; else typeReadonlyTmpl">
    <j-button
      nz-dropdown
      nzTrigger="click"
      [nzDropdownMenu]="menu"
      [icon]="selectedIssueTypeIcon"
      [iconSize]="20"
      [className]="'btn-empty font-semibold uppercase text-textMedium text-13'"
    >
      {{ issue?.type }}-{{ issue?.id }}
    </j-button>
  </ng-container>

  <ng-template #typeReadonlyTmpl>
    <j-button
      [icon]="selectedIssueTypeIcon"
      [iconSize]="20"
      [className]="'btn-empty font-semibold uppercase text-textMedium text-13'"
    >
      {{ issue?.type }}-{{ issue?.id }}
    </j-button>
  </ng-template>
</div>

<nz-dropdown-menu #menu="nzDropdownMenu">
  <ul nz-menu nzNoAnimation>
    <ng-container *ngFor="let option of issueTypes">
      <li nz-menu-item *ngIf="!isTypeSelected(option.value)" (click)="updateIssue(option.value)">
        <div class="flex items-center">
          <svg-icon [name]="option.icon" [size]="20"> </svg-icon>
          <span class="ml-3 font-semibold uppercase text-textMedium text-13">{{
            option.value
          }}</span>
        </div>
      </li>
    </ng-container>
  </ul>
</nz-dropdown-menu>
